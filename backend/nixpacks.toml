[phases.setup]
nixPkgs = [
  "python311",
  "poppler_utils",
  "libGL",
  "gcc",
  "zlib",
  "libjpeg",
  "libpng",
  "freetype",
  "pkg-config",
]

[phases.install]
cmds = [
  "apt-get update -qq && apt-get install -y tesseract-ocr tesseract-ocr-eng || echo 'apt tesseract failed'",
  "pip3 install --break-system-packages -r requirements.txt"
]

[start]
cmd = "python3 supabase_worker.py"
[phases.setup]
nixPkgs = [
  "python311",
  "poppler_utils",
  "tesseract",
  "tessdata",
  "libGL",
  "gcc",
  "zlib",
  "libjpeg",
  "libpng",
  "freetype",
  "pkg-config",
  "tesseract",
  "libredwg",
]

[phases.install]
cmds = [
  "pip3 install --break-system-packages -r requirements.txt",
  "pip3 install --break-system-packages pytesseract",
]

[start]
cmd = "python3 supabase_worker.py"
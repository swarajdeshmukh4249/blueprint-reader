[phases.setup]
nixPkgs = [
  "python311",
  "poppler",          # ✅ was poppler_utils
  "poppler_utils",    # ✅ add this too for pdfinfo/pdftotext binaries
  "tesseract",        # OCR engine
  "tesseract-ocr-eng", # ✅ English language data
  "libGL",
  "gcc",
  "zlib",
  "libjpeg",
  "libpng",
  "freetype",
  "pkg-config",
  "libredwg",
]

[phases.install]
cmds = [
  "pip3 install --break-system-packages -r requirements.txt",
  "pip3 install --break-system-packages pytesseract PyMuPDF psutil",
]

[deploy]
startCommand = "python3 supabase_worker.py"
restartPolicyType = "always"
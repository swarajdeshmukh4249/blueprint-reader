[phases.setup]
nixPkgs = [
  "python311",
  "tesseract",
  "poppler_utils",
  "libGL",
  "libGLU",
  "gcc",
  "zlib",
  "libjpeg",
  "libpng",
  "freetype",
  "pkg-config",
]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip",
  "/opt/venv/bin/pip install -r requirements.txt"
]

[start]
cmd = "/opt/venv/bin/python supabase_worker.py"